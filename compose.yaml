services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: evently
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: evently
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - evently_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evently -d evently"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  pgadmin:
    image: dpage/pgadmin4:9.13
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@evently.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - evently_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  evently_postgres_data:
  evently_pgadmin_data:
