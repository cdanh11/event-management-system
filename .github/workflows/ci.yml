name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evently
          POSTGRES_PASSWORD: evently
          POSTGRES_DB: evently_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evently -d evently_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://evently:evently@localhost:5432/evently_ci_test
      TEST_POSTGRES_URL: postgresql+psycopg://evently:evently@localhost:5432/evently_ci_test
      JWT_SECRET: ci-only-key-with-at-least-thirty-two-characters
      SMTP_HOST: ""
      NOTIFY_WEBHOOK_URL: ""
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m alembic upgrade head
      - run: python -m pytest --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run audit:copy
      - run: npm run build
